<body style="background: #222; color: #ddd; font-family: sans-serif">
  <div style="padding: 20px">
    <button id="tbbtn" style="padding: 8px">
      <div
        class="sc-3fbd69ac-1 sc-3fbd69ac-142 gGIjpw flbGau"
        style="height: 20px; width: 20px; background: #68c"
      ></div>
    </button>
    <div
      id="editor"
      contenteditable="true"
      style="border: 1px solid #888; min-height: 60px; margin: 12px 0; padding: 6px"
    >
      prompt:
    </div>
    <div id="toasts"></div>
  </div>
  <script>
    /* Mock of the native Prompt Chunks panel.
       The data model and the drag-and-drop follow the site bundle: chunks and categories carry an order
       array, dragstart writes {id, sourceCategory, index} under a custom MIME type, dragover picks a side
       from clientX and drop inserts at that index. A collapsed category keeps its children in the DOM
       (display:none), like the real component. */
    const MIME_MACRO = 'application/x-prompt-chunk-macro';
    const MIME_CAT = 'application/x-prompt-chunk-category';

    window.mockLog = [];
    const log = (s) => window.mockLog.push(s);
    const panel = () => document.getElementById('promptChunkContainer');
    const toast = (t) => {
      document.getElementById('toasts').textContent = t;
    };

    let seq = 0;
    const newId = () => 'c' + ++seq;
    const chunks = new Map();
    let cats = [];
    const rootOrder = [];
    let ctx = null;

    const official = [
      {
        id: 'o1',
        label: 'Quality Tags',
        expansion: 'best quality, amazing quality, very aesthetic, absurdres',
      },
      { id: 'o2', label: 'Bad Anatomy', expansion: 'bad anatomy, bad hands, extra digits' },
    ];

    const cat = (label, color, collapsed = false) => ({
      id: `k${++seq}`,
      label,
      color,
      collapsed,
      childOrder: [],
    });
    function addChunk(target, label, expansion, color) {
      const id = newId();
      chunks.set(id, { id, label, expansion, color });
      (target ? target.childOrder : rootOrder).push(id);
      return id;
    }
    const characters = cat('Characters', '#6B7280');
    const styles = cat('Styles', '#6a9edd');
    const positions = cat('Positions', '#44ff00', true);
    const parts = cat('Body Parts', '#72ff7d');
    cats.push(characters, styles, positions, parts);
    addChunk(
      characters,
      'Nejire Prompt',
      '1::hadou nejire, blue hair, long hair::, perky breasts',
      '#5a8fdc',
    );
    addChunk(characters, 'Mina prompt', '1::mina ahido, pink hair, pink skin::', '#c967f2');
    addChunk(characters, 'Tsuyu', 'girl, 1::asui tsuyu, green hair::', '#72ff7d');
    addChunk(styles, 'Squishy Style', 'artist:eigaka, artist:krekkov', '#9153c7');
    addChunk(styles, 'Twitter Style', '2::yellow background, solid colors::', '#fff100');
    addChunk(positions, 'Glory Wall', 'glory wall, breast focus', '#567adc');
    addChunk(positions, 'Folded', 'folded, knees to chest', '#de7b5d');
    addChunk(null, 'Loose chunk', 'some uncategorised tags', '#d95454');

    const esc = (s) =>
      String(s).replace(
        /[&<>"]/g,
        (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch],
      );
    const bodyOf = (el) => {
      const b = el.closest('[data-body]')?.dataset.body;
      return !b || b === 'root' ? null : b;
    };
    const orderOf = (catId) => {
      if (!catId) return rootOrder;
      const c = cats.find((x) => x.id === catId);
      return c ? c.childOrder : [];
    };

    function save() {
      log('save');
      localStorage.setItem(
        'mock:order',
        JSON.stringify({ cats: cats.map((c) => [c.label, c.childOrder]), root: rootOrder }),
      );
    }

    function chunkEl(id) {
      const c = chunks.get(id);
      return `<div class="sc-7d061733-30 cyEZwx"><div class="sc-7d061733-29 kPgOiw"></div><div draggable="true" color="${c.color}" data-chunk="${id}" title="${esc(c.expansion)}

Click to insert, drag to reorder" class="sc-7d061733-4 sc-7d061733-5 blmQDa gOqbYB"><span>${esc(c.label)}</span><button title="Edit Chunk" class="sc-7d061733-6 exWFTQ">✎</button></div><div class="sc-7d061733-29 eJMBPP"></div></div>`;
    }

    function officialEl(o) {
      return `<div color="#6B7280" data-chunk="${o.id}" title="${esc(o.expansion)}

Click to insert" class="sc-7d061733-4"><span>${esc(o.label)}</span></div>`;
    }

    function catEl(c) {
      const empty = c.childOrder.length
        ? ''
        : '<span style="font-size: 0.75rem; opacity: 0.5; font-style: italic;">Empty category</span>';
      return `<div class="sc-7d061733-27 jceqyz">
      <div draggable="true" color="${c.color}" data-header="${c.id}" class="sc-7d061733-25 joNVoI"><span class="sc-7d061733-28 dUrBch"><div class="sc-3fbd69ac-1 iZWGWf">${c.collapsed ? '▸' : '▾'}</div></span><span style="flex: 1 1 0%;">${esc(c.label)}</span><span style="font-size: 0.75rem; opacity: 0.6;">${c.childOrder.length}</span><button title="Edit Category" class="sc-7d061733-6 exWFTQ">✎</button></div>
      <div class="sc-7d061733-26 dCsPrf" data-body="${c.id}" style="display: ${c.collapsed ? 'none' : 'flex'}">${c.childOrder
        .map(chunkEl)
        .join(
          '',
        )}<div class="sc-7d061733-31 hZQNzA" data-dropzone="${c.id}"></div>${empty}</div></div>`;
    }

    function renderPanel() {
      const p = panel();
      if (!p) return;
      p.innerHTML = `<div class="sc-3b02d579-0 fCjzzh"><div class="sc-d29c49cf-0 elFbld" style="cursor: pointer;">Prompt Chunks</div><div class="sc-d29c49cf-0 hjDkOc" style="cursor: pointer;">Settings</div></div>
      <div class="sc-7d061733-0 fqZsGH">
        <div class="sc-7d061733-23 kwOXSf"><span class="sc-7d061733-2 jxlibF">Prompt Chunks</span><div class="sc-7d061733-24 dpWrhR"><button title="Add Category" class="sc-7b42663-2 dWYLjn" style="padding: 6px;">+</button><button title="Add Prompt Chunk" class="sc-7b42663-2 dWYLjn" style="padding: 6px;">+c</button></div></div>
        <div class="sc-7d061733-1 jhlSyG">
          <div class="sc-7d061733-3 ejliLm"><span style="font-size: 0.8rem; opacity: 0.6;">Official</span><div>${official
            .map(officialEl)
            .join('')}</div></div>
          <div class="sc-7d061733-3 ejliLm" data-body="root">${rootOrder
            .map(chunkEl)
            .join('')}<div class="sc-7d061733-31 hZQNzA" data-dropzone="root"></div></div>
          ${cats.map(catEl).join('')}
          <div style="flex: 1 1 0px;"></div>
          <button class="sc-7b42663-0 sc-7b42663-1" style="width: unset;">Delete All</button>
        </div>
      </div>`;
    }

    function onMove(id, sourceCat, targetCat, index) {
      const src = orderOf(sourceCat);
      const dst = orderOf(targetCat);
      const si = src.indexOf(id);
      if (si >= 0) src.splice(si, 1);
      dst.splice(Math.min(index, dst.length), 0, id);
      log(`move:${id}:${sourceCat}:${targetCat}:${index}`);
      save();
      renderPanel();
    }

    function moveCat(from, to) {
      const [c] = cats.splice(from, 1);
      cats.splice(to, 0, c);
      log(`movecat:${from}:${to}`);
      save();
      renderPanel();
    }

    function clearOver() {
      for (const el of panel().querySelectorAll('[data-over]')) delete el.dataset.over;
    }

    let expandT = null;
    function onDragStart(e) {
      clearTimeout(expandT);
      expandT = null;
      const ch = e.target.closest('[data-chunk]');
      if (ch) {
        if (!ch.hasAttribute('draggable')) {
          e.preventDefault();
          return;
        }
        const id = ch.dataset.chunk;
        const catId = bodyOf(ch);
        const index = orderOf(catId).indexOf(id);
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.setData(MIME_MACRO, JSON.stringify({ id, sourceCategory: catId, index }));
        e.dataTransfer.effectAllowed = 'copyMove';
        e.dataTransfer.setDragImage(new Image(), 0, 0);
        ctx = { type: 'macro', id, sourceCategory: catId, index };
        return;
      }
      const h = e.target.closest('[data-header]');
      if (!h) return;
      const index = cats.findIndex((c) => c.id === h.dataset.header);
      e.dataTransfer.setData(MIME_CAT, JSON.stringify({ id: h.dataset.header, index }));
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setDragImage(new Image(), 0, 0);
      ctx = { type: 'category', id: h.dataset.header, sourceCategory: null, index };
    }

    function onDragOver(e) {
      const types = [...e.dataTransfer.types];
      const ch = e.target.closest('[data-chunk]');
      const h = e.target.closest('[data-header]');
      const dz = e.target.closest('[data-dropzone]');
      if (types.includes(MIME_MACRO)) {
        if (ch) {
          if (ctx?.id === ch.dataset.chunk) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          clearOver();
          const r = ch.getBoundingClientRect();
          ch.dataset.over = e.clientX < r.left + r.width / 2 ? 'left' : 'right';
          return;
        }
        if (h) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          h.dataset.over = '1';
          const c = cats.find((x) => x.id === h.dataset.header);
          if (c?.collapsed && !expandT)
            expandT = setTimeout(() => {
              c.collapsed = false;
              expandT = null;
              renderPanel();
            }, 500);
          return;
        }
        if (dz) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          dz.dataset.over = '1';
        }
        return;
      }
      if (!types.includes(MIME_CAT) || !h) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const index = cats.findIndex((c) => c.id === h.dataset.header);
      if (!ctx || ctx.id === h.dataset.header) return;
      if (ctx.index !== index) {
        moveCat(ctx.index, index);
        ctx.index = index;
      }
    }

    function onDragLeave(e) {
      const el = e.target.closest('[data-over]');
      if (el && !el.contains(e.relatedTarget)) delete el.dataset.over;
    }

    function onDrop(e) {
      const macro = e.dataTransfer.getData(MIME_MACRO);
      if (!macro) return;
      e.preventDefault();
      clearOver();
      const { id, sourceCategory, index: s } = JSON.parse(macro);
      const ch = e.target.closest('[data-chunk]');
      const h = e.target.closest('[data-header]');
      const dz = e.target.closest('[data-dropzone]');
      if (ch) {
        const targetId = ch.dataset.chunk;
        if (targetId === id) return;
        const catId = bodyOf(ch);
        const index = orderOf(catId).indexOf(targetId);
        const r = ch.getBoundingClientRect();
        const before = e.clientX < r.left + r.width / 2;
        let d;
        if (before) d = sourceCategory === catId && s < index ? index - 1 : index;
        else d = sourceCategory === catId && s < index ? index : index + 1;
        onMove(id, sourceCategory, catId, d);
        return;
      }
      if (h) {
        onMove(id, sourceCategory, h.dataset.header, orderOf(h.dataset.header).length);
        return;
      }
      if (dz) {
        const catId = dz.dataset.dropzone === 'root' ? null : dz.dataset.dropzone;
        onMove(id, sourceCategory, catId, orderOf(catId).length);
      }
    }

    function onDragEnd() {
      clearOver();
      clearTimeout(expandT);
      expandT = null;
      ctx = null;
      save();
    }

    /* ── click / insert / collapse ── */
    let hasEditor = false;
    const ed = document.getElementById('editor');
    ed.addEventListener('focus', () => {
      hasEditor = true;
    });

    function insert(id) {
      const c = chunks.get(id) || official.find((o) => o.id === id);
      if (!hasEditor) {
        toast('Click in a prompt field first, then click a chunk to insert it.');
        return;
      }
      const s = document.createElement('span');
      s.textContent = `[${c.label}]`;
      ed.appendChild(s);
      log(`insert:${c.label}`);
    }

    function onClick(e) {
      const b = e.target.closest('button');
      if (b) {
        if (b.title === 'Add Category') return openCatForm(null);
        if (b.title === 'Add Prompt Chunk') return openChunkForm(null);
        if (b.title === 'Edit Chunk') return openChunkForm(b.closest('[data-chunk]').dataset.chunk);
        if (b.title === 'Edit Category')
          return openCatForm(b.closest('[data-header]').dataset.header);
        return;
      }
      const h = e.target.closest('[data-header]');
      if (h) {
        const c = cats.find((x) => x.id === h.dataset.header);
        if (c) {
          c.collapsed = !c.collapsed;
          log(`collapse:${c.label}:${c.collapsed}`);
          renderPanel();
        }
        return;
      }
      const ch = e.target.closest('[data-chunk]');
      if (ch) insert(ch.dataset.chunk);
    }

    /* ── forms: the native panel swaps its whole content for the form ── */
    function wireForm(scope, onCancel, onSave, onDelete) {
      scope.querySelector('.f-actions').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const t = b.textContent.trim();
        if (t === 'Cancel') onCancel();
        else if (t === 'Delete') onDelete();
        else if (t === 'Save') onSave();
      });
      const x = scope.querySelector('[title="Close"]');
      if (x) x.addEventListener('click', onCancel);
    }

    function openChunkForm(chunkId) {
      const c = chunkId ? chunks.get(chunkId) : null;
      const curCat = c ? bodyOf(panel().querySelector(`[data-chunk="${chunkId}"]`)) : null;
      const st = {
        label: c?.label ?? '',
        expansion: c?.expansion ?? '',
        color: c?.color ?? '#6B7280',
        cat: cats.find((k) => k.id === curCat)?.label ?? '',
      };
      panel().innerHTML = `<div class="sc-7d061733-0 fqZsGH" id="mockform"><div class="sc-7d061733-23 kwOXSf"><span class="sc-7d061733-2">${
        c ? 'Edit Prompt Chunk' : 'New Prompt Chunk'
      }</span><button class="sc-7b42663-2" title="Close">✕</button></div><label>Name</label><input type="text" value="${esc(
        st.label,
      )}" placeholder="e.g., My Style Tags"><label>Content</label><textarea>${esc(
        st.expansion,
      )}</textarea><label>Category</label><select><option value="">Uncategorized</option>${cats
        .map(
          (k) =>
            `<option value="${esc(k.label)}"${k.label === st.cat ? ' selected' : ''}>${esc(k.label)}</option>`,
        )
        .join('')}</select><label>Color</label><div><input value="${
        st.color
      }" spellcheck="false"></div><div class="f-actions">${
        c ? '<button>Delete</button>' : ''
      }<button>Cancel</button><button>Save</button></div></div>`;
      const f = panel().querySelector('#mockform');
      const [name, hex] = f.querySelectorAll('input');
      const ta = f.querySelector('textarea');
      const sel = f.querySelector('select');
      name.addEventListener('input', () => {
        st.label = name.value;
      });
      ta.addEventListener('input', () => {
        st.expansion = ta.value;
      });
      sel.addEventListener('change', () => {
        st.cat = sel.value;
      });
      hex.addEventListener('input', () => {
        st.color = hex.value;
      });
      wireForm(
        f,
        () => {
          log('cancel');
          renderPanel();
        },
        () => {
          if (!st.label.trim()) return toast('Name is required');
          if (!st.expansion.trim()) return toast('Content is required');
          saveChunk(chunkId, st, curCat);
        },
        () => deleteChunk(chunkId, curCat),
      );
    }

    function saveChunk(chunkId, st, curCatId) {
      let id = chunkId;
      if (!id) {
        id = newId();
        chunks.set(id, { id, label: '', expansion: '', color: '#6B7280' });
        rootOrder.push(id);
      }
      const c = chunks.get(id);
      c.label = st.label.trim();
      c.expansion = st.expansion.trim();
      c.color = st.color;
      const target = cats.find((k) => k.label === st.cat) || null;
      log(`saved:${c.label}:${st.cat}:${c.color}`);
      if (curCatId !== (target?.id ?? null)) onMove(id, curCatId, target?.id ?? null, 0);
      else {
        save();
        renderPanel();
      }
    }

    function deleteChunk(chunkId, curCatId) {
      const list = orderOf(curCatId);
      const si = list.indexOf(chunkId);
      if (si >= 0) list.splice(si, 1);
      chunks.delete(chunkId);
      log(`delchunk:${chunkId}`);
      save();
      renderPanel();
    }

    function openCatForm(catId) {
      const c = cats.find((k) => k.id === catId) || null;
      const st = { label: c?.label ?? '', color: c?.color ?? '#6B7280' };
      panel().innerHTML = `<div class="sc-7d061733-0 fqZsGH" id="mockcatform"><div class="sc-7d061733-23 kwOXSf"><span class="sc-7d061733-2">${
        c ? 'Edit Category' : 'New Category'
      }</span><button class="sc-7b42663-2" title="Close">✕</button></div><label>Name</label><input type="text" value="${esc(
        st.label,
      )}" placeholder="Category name..."><label>Color</label><div><input value="${
        st.color
      }" spellcheck="false"></div><div class="f-actions">${
        c ? '<button>Delete</button>' : ''
      }<button>Cancel</button><button>Save</button></div></div>`;
      const f = panel().querySelector('#mockcatform');
      const [name, hex] = f.querySelectorAll('input');
      name.addEventListener('input', () => {
        st.label = name.value;
      });
      hex.addEventListener('input', () => {
        st.color = hex.value;
      });
      wireForm(
        f,
        () => {
          log('cancel');
          renderPanel();
        },
        () => {
          if (!st.label.trim()) return toast('Name is required');
          saveCat(c, st);
        },
        () => deleteCat(c),
      );
    }

    function saveCat(c, st) {
      if (c) {
        c.label = st.label.trim();
        c.color = st.color;
        log(`savedcat:${c.label}:${c.color}`);
      } else {
        cats.push({
          id: `k${++seq}`,
          label: st.label.trim(),
          color: st.color,
          collapsed: false,
          childOrder: [],
        });
        log(`newcat:${st.label}`);
      }
      save();
      renderPanel();
    }

    function deleteCat(c) {
      if (!c) return renderPanel();
      rootOrder.push(...c.childOrder);
      cats = cats.filter((k) => k !== c);
      log(`delcat:${c.label}`);
      save();
      renderPanel();
    }

    /* ── panel open / close ── */
    const handlers = {
      click: onClick,
      dragstart: onDragStart,
      dragend: onDragEnd,
      dragover: onDragOver,
      dragleave: onDragLeave,
      drop: onDrop,
    };

    function openPanel() {
      if (panel()) return;
      document.body.insertAdjacentHTML(
        'beforeend',
        '<div id="promptChunkContainer" data-popper-placement="right-start" class="sc-5371c89c-1 dmPIpI"></div>',
      );
      const p = panel();
      for (const [type, fn] of Object.entries(handlers)) p.addEventListener(type, fn);
      renderPanel();
      log('open');
    }

    document.getElementById('tbbtn').addEventListener('click', () => {
      const p = panel();
      if (p) {
        p.remove();
        log('close');
      } else openPanel();
    });
    document.addEventListener('mousedown', (e) => {
      const p = panel();
      if (p && !p.contains(e.target) && !e.target.closest('#tbbtn')) {
        p.remove();
        log('close');
      }
    });

    window.mock = {
      order: () => ({
        cats: cats.map((c) => ({
          label: c.label,
          chunks: c.childOrder.map((id) => chunks.get(id).label),
        })),
        root: rootOrder.map((id) => chunks.get(id).label),
      }),
      log: () => window.mockLog,
      openPanel,
    };
  </script>
  <script>
    // mimics NovelAI's global shortcut handlers (w/a/s/d/f/q/+/-/1): they only skip real inputs via document.activeElement
    window.addEventListener('keydown', (e) => {
      const n = document.activeElement;
      if (
        (!n ||
          (n.tagName !== 'INPUT' &&
            n.tagName !== 'TEXTAREA' &&
            n.tagName !== 'SELECT' &&
            n.getAttribute('contenteditable') !== 'true')) &&
        !e.ctrlKey &&
        !e.metaKey &&
        !e.altKey &&
        'wasdfq+-=1'.includes(e.key.toLowerCase())
      ) {
        e.preventDefault();
        window.mockLog.push('site-shortcut:' + e.key);
